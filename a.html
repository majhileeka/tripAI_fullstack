<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripAI Planner 🌍</title>
  <link rel="stylesheet" href="b.css">
</head>
<body>
  <header>
    <h1>TripAI Planner</h1>
    <p>Plan your perfect trip instantly with AI ✈️</p>
  </header>

  <main>
    <form id="tripForm">
      <label>Budget (USD):</label>
      <input type="number" id="budget" required>

      <label>Days of Travel:</label>
      <input type="number" id="days" required>

      <label>Trip Type:</label>
      <select id="type" required>
        <option value="domestic">Domestic</option>
        <option value="international">International</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>

    <section id="results"></section>
  </main>

  <footer>
    <p>© 2025 TripAI Planner — Smart Travel Assistant</p>
  </footer>

  <script src="c.js"></script>
</body>
</html>
